<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UFT-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Login to your Social Media App account or sign up for a new account to connect with friends and share updates.">
    <meta name="keywords" content="login, sign up, social media, account, authentication, user access">
    <meta name="author" content="Malin Skrettingland">
    <link rel="stylesheet" href="/styles/css/style.css">
    <!-- favicon -->
	<link rel="icon" href="/favicon.ico">
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">
    <title>Login | Social Media App</title>
</head>

<body>
    <header id="main-header">
    </header>
    <main>
        <div class="modal modal-sheet position-static d-block bg-body-secondary p-4 py-md-5" tabindex="-1" role="dialog"
            id="modalSignin">
            <div class="modal-dialog">
                <div class="modal-content rounded-4 shadow">
                    <div class="modal-header p-5 pb-4 border-bottom-0">
                        <h1 id="form-title" class="fw-bold mb-0 fs-2">Login</h1>
                        <button id="close-modal-btn" type="button" class="btn-close" data-bs-dismiss="modal"
                            aria-label="Close">
                        </button>
                    </div>
                    <div class="modal-body p-5 pt-0">
                        <form id="auth-form" class="">
                            <div id="name-field" class="form-floating mb-3 d-none">
                                <input id="name" name="name" type="text" class="form-control rounded-3" placeholder="">
                                <label for="name">Your name</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control rounded-3" id="email" name="email"
                                    placeholder="" required>
                                <label for="email">Email address</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control rounded-3" id="password" name="password"
                                    placeholder="" required>
                                <label for="password">Password</label>
                            </div>
                            <button id="submit-button" class="w-100 mb-2 btn btn-lg rounded-3 btn-primary"
                                type="submit">Login</button>
                        </form>
                        <p id="toggle-message" class="mt-2">Don't have an account?
                            <button id="toggle-mode" class="mt-2 w-100 rounded-3 btn btn-primary">Sign up</button>
                        </p>

                        <p id="status-message"></p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer id="main-footer">
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
    <script type="module" src="/js/components/loadComponents.js"></script>
    <script type="module" src="/js/account/login.js"></script>
</body>

</html>
